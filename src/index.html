</head>

<body class="mat-typography">
	<div class="allinner_wrapper">
		<app-root></app-root>
	</div>
	<!-- Optional JavaScript -->
	<!-- jQuery first, then Popper.js, then Bootstrap JS -->
	<script src="https://code.jquery.com/jquery-3.5.1.js" crossorigin="anonymous"></script>
	<script src="assets/js/bootstrap-input-spinner.js"></script>
	<script src='https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js'></script>
	<script
		src='https://cdnjs.cloudflare.com/ajax/libs/eonasdan-bootstrap-datetimepicker/4.17.47/js/bootstrap-datetimepicker.min.js'></script>
	<script src="assets/js/owl.carousel.js"></script>
	<script type="text/javascript"
		src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.9.0/moment-with-locales.min.js"></script>
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">


	<script
		src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
	<script>
		$( "input[type='number']" ).inputSpinner()
	</script>

	<!----form date picker---------->

	<!----header menu---------->
	<script>
		$( document ).ready( function ()
		{
			$( "button.navbar-toggler" ).click( function ()
			{
				$( ".navbar-toggler" ).toggleClass( "closemenus" );
			} );

			$( '.clr-Fil' ).on( 'click', function ()
			{
				$( this ).siblings().removeClass( 'active' )
				$( this ).addClass( 'active' );
			} )
			if ( /Mobi/.test( navigator.userAgent ) )
			{
				// if mobile device, use native pickers
				$( ".time input" ).attr( "type", "time" );
			} else
			{
				$( "#timepicker" ).datetimepicker( {
					format: "HH:mm",
					allowInputToggle: true,
					icons: {
						up: "fa fa-chevron-up",
						down: "fa fa-chevron-down"
					}
				} );
			}
		} );
	</script>


	<script src="assets/js/spinner_picker.js"></script>


	<script type="text/javascript"
		src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
		defer=""></script>


	<script type="text/javascript">
		function googleTranslateElementInit ()
		{
			new google.translate.TranslateElement( {
				pageLanguage: 'ko',
				includedLanguages: 'en',
				layout: google.translate.TranslateElement.FloatPosition.TOP_LEFT,
				autoDisplay: false
			},
				'google_translate_element' );
		}
	</script>
</body>

</html>
