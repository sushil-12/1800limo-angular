<div class="innerpage_wrapper privacy-page">
   <!-- Hero Section -->
   <header class="privacy-hero text-center py-5">
      <div class="container">
         <span class="hero-badge">
            <i [class]="deliveryMembershipData.badge.iconClass"></i> {{ deliveryMembershipData.badge.text }}
         </span>
         <h1 class="font-weight-bold mb-2" [innerHTML]="deliveryMembershipData.title"></h1>
         <p class="text-muted update-text mb-4">Last Updated: {{ deliveryMembershipData.lastUpdated }}</p>
         <p class="lead mx-auto description-text">{{ deliveryMembershipData.description }}</p>
      </div>
   </header>

   <!-- Content Section -->
   <section class="privacy-content pb-5">
      <div class="container">
         <div class="privacy-card">
            <div class="privacy-section" *ngFor="let section of safeSections">
               <div class="section-header d-flex align-items-center">
                  <div class="icon-wrapper mr-3">
                     <i [class]="section.iconClass"></i>
                  </div>
                  <h3 class="mb-0">{{ section.title }}</h3>
               </div>
               <div class="section-body mt-3" [innerHTML]="section.safeContent"></div>
            </div>
         </div>
         <p class="mt-4 text-center text-muted">© 1-800-LIMO.COM - All Rights Reserved</p>
      </div>
   </section>
</div>
