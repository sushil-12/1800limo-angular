<div class="innerpage_wrapper privacy-page">
	<!-- Hero Section -->
	<header class="privacy-hero text-center py-5">
		<div class="container">
			<span class="hero-badge">
				<i [class]="insuranceData.badge.iconClass"></i> {{ insuranceData.badge.text }}
			</span>
			<h1 class="font-weight-bold mb-2">{{ insuranceData.title }}</h1>
			<p class="text-muted update-text mb-4" *ngIf="insuranceData.lastUpdated">Last Updated: {{
				insuranceData.lastUpdated }}</p>
			<p class="lead mx-auto description-text">{{ insuranceData.description }}</p>
		</div>
	</header>

	<!-- Content Section -->
	<section class="privacy-content pb-5">
		<div class="container">
			<div class="privacy-card">
				<div class="privacy-section" *ngFor="let section of safeSections">
					<div class="section-header d-flex align-items-start">
						<div class="icon-wrapper mr-3 flex-shrink-0">
							<i [class]="section.iconClass"></i>
						</div>
						<h3 class="mb-0">{{ section.title }}</h3>
					</div>

					<!-- Standard Content -->
					<div class="section-body mt-3" *ngIf="!section.isLinksSection" [innerHTML]="section.safeContent">
					</div>

					<!-- Links Section -->
					<div class="section-body mt-3" *ngIf="section.isLinksSection">
						<div class="links-grid">
							<a *ngFor="let link of section.links" [href]="link.url" target="_blank"
								class="link-card d-flex justify-content-between align-items-center mb-3">
								<span class="link-title">{{ link.title }}</span>
								<i class="bi bi-chevron-right arrow-icon"></i>
							</a>
						</div>
					</div>

				</div>
			</div>
			<p class="mt-4 text-center text-muted">© 1-800-LIMO.COM - All Rights Reserved</p>
		</div>
	</section>
</div>
