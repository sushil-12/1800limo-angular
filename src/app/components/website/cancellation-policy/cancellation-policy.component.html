<div class="innerpage_wrapper privacy-page">
   <!-- Hero Section -->
   <header class="privacy-hero text-center py-5">
      <div class="container">
         <span class="hero-badge">
            <i [class]="cancellationData.badge.iconClass"></i> {{ cancellationData.badge.text }}
         </span>
         <h1 class="font-weight-bold mb-2">{{ cancellationData.title }}</h1>
         <p class="text-muted update-text mb-4" *ngIf="cancellationData.lastUpdated">Last Updated: {{
            cancellationData.lastUpdated }}</p>
         <p class="lead mx-auto description-text">{{ cancellationData.description }}</p>
      </div>
   </header>

   <!-- Content Section -->
   <section class="privacy-content pb-5">
      <div class="container">
         <div class="privacy-card">
            <div class="privacy-section" *ngFor="let section of safeSections">
               <div class="section-header d-flex align-items-start">
                  <div class="icon-wrapper mr-3 flex-shrink-0">
                     <i [class]="section.iconClass"></i>
                  </div>
                  <h3 class="mb-0">{{ section.title }}</h3>
               </div>

               <!-- Standard Content -->
               <div class="section-body mt-3" [innerHTML]="section.safeContent"></div>
            </div>

            <!-- Special Link Component -->
            <!-- <div class="privacy-section mt-5 border-top pt-4" *ngIf="cancellationData.recommendedLink">
               <div class="links-grid">
                  <a [routerLink]="[cancellationData.recommendedLink.urlReference]"
                     class="link-card d-flex justify-content-between align-items-center mb-0">
                     <span class="link-title">{{ cancellationData.recommendedLink.title }}</span>
                     <i class="bi bi-chevron-right arrow-icon"></i>
                  </a>
               </div>
            </div> -->

         </div>
         <p class="mt-4 text-center text-muted">© 1-800-LIMO.COM - All Rights Reserved</p>
      </div>
   </section>
</div>
