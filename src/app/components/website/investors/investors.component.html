<div class="innerpage_wrapper investors-page">
   <!-- Hero Section -->
   <header class="investors-hero text-center py-5">
      <div class="container">
         <span class="hero-badge">
            <i [class]="investorsData.badge.iconClass"></i> {{ investorsData.badge.text }}
         </span>
         <h1 class="font-weight-bold mb-2">{{ investorsData.title }}</h1>
         <p class="text-muted update-text mb-4">Last Updated: {{ investorsData.lastUpdated }}</p>
         <p class="lead mx-auto description-text">{{ investorsData.description }}</p>
      </div>
   </header>

   <!-- Content Section -->
   <section class="investors-content pb-5">
      <div class="container text-center">

         <!-- Video Section -->
         <div class="video-container mb-5">
            <iframe [src]="safeVideoUrl" width="100%" height="500px" title="YouTube video player" frameborder="0"
               allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
               allowfullscreen>
            </iframe>
         </div>

         <!-- Founder Section -->
         <div class="founder-section mb-5 mx-auto">
            <div class="founder-image-wrapper mb-4">
               <!-- Using an existing UI headshot asset or placeholder here -->
               <img [src]="investorsData.founder.image" alt="Founder" class="founder-img shadow-sm"
                  onerror="this.onerror=null; this.src='assets/images/user.png'">
            </div>

            <div class="founder-text mx-auto text-muted">
               <p *ngFor="let paragraph of investorsData.founder.text" class="mb-3">{{ paragraph }}</p>
            </div>
         </div>

         <!-- Proposal Link -->
         <!-- <div class="proposal-link-wrapper mx-auto">
            <a [href]="investorsData.proposalLink.url"
               class="link-card d-flex justify-content-between align-items-center">
               <span class="link-title">{{ investorsData.proposalLink.title }}</span>
               <i class="bi bi-chevron-right arrow-icon"></i>
            </a>
         </div> -->

      </div>
   </section>
</div>
