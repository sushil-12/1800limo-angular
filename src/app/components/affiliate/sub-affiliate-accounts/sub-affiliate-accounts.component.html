<ngx-spinner type="ball-scale-multiple"></ngx-spinner>
<main>
    <!-- Main page content-->
    <section class="user_information" id="sub_affiliate_accounts">
        <h2 class="headinginfo">Sub Admin Accounts </h2>
        <div class="containeredd">

            <div class="row">
                <div class="col-md-12 mt-3 mb-3">
                    <mat-form-field appearance="outline">
                        <mat-label>Search Filter by Key word</mat-label>
                        <input type="text" matInput (keyup)="handleSearchKeyword($event.target.value)"
                            [value]="searchText" placeholder="Search by name, email, cell phone, address" id="keyword">
                    </mat-form-field>
                </div>
                <!-- <div class="col-md-2  mt-3 mb-3">
					<button class="custom-btn button2 btnclass" (click)="loadClientAccounts()">Search</button>
				</div> -->
            </div>
        </div>

        <div class="containeredd driverside_table">
            <div class="row">
                <div class="col-md-12 table-responsive">
                    <table class="table table-striped table-bordered dataTable dt-responsive" id="dataTable" role="grid"
                        aria-describedby="dataTable_info" style="width: 100%;" width="100%" cellspacing="0">
                        <thead style="background: #f3933d;">
                            <tr role="row">
                                <th style="width: 11%;">Actions</th>
                                <th>Status</th>
                                <th>Notifications</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th>Address</th>

                            </tr>
                        </thead>
                        <tbody>
                            <tr role="row" class="odd" *ngFor="let subAffAcc of clients">
                                <td>
                                    <a class="user-profileded btn btn-icon btn-transparent-dark "
                                        id="navbarDropdownUserImage" href="javascript:void(0);" role="button"
                                        data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                                        (click)="editSubAff(subAffAcc.acc_id)">
                                        <span>View</span>
                                    </a>
                                </td>
                                <td>
                                    <mat-slide-toggle class="example-margin" [color]="color"
                                        [checked]="subAffAcc.status" [disabled]="disabled"
                                        (change)="enableDisableClicked($event,subAffAcc.acc_id)">
                                    </mat-slide-toggle>
                                </td>
                                <td>
                                    <mat-slide-toggle class="example-margin" [color]="color"
                                        [checked]="subAffAcc.notification" [disabled]="disabled"
                                        (change)="enableDisableNotification($event,subAffAcc.acc_id)">
                                    </mat-slide-toggle>
                                </td>
                                <td *ngIf="subAffAcc.middle_name==null;else middleName">
                                    <span
                                        [innerHTML]="highlighText(subAffAcc?.first_name+' '+subAffAcc?.last_name)"></span>
                                </td>
                                <ng-template #middleName>
                                    <td>
                                        <span
                                            [innerHTML]="highlighText(subAffAcc?.first_name+' '+subAffAcc?.middle_name+' '+subAffAcc?.last_name)"></span>
                                    </td>
                                </ng-template>
                                <td><span [innerHTML]="highlighText(subAffAcc?.email)"></span></td>
                                <td><span [innerHTML]="highlighText(subAffAcc?.mobileIsd+subAffAcc?.mobile)"></span>
                                </td>
                                <td><span [innerHTML]="highlighText(subAffAcc?.Address)"></span></td>

                            </tr>

                        </tbody>
                    </table>
                </div>
                <!----BACK BTN---->
                <nav aria-label="Page navigation example">
                    <ul class="pagination pagination-circle pg-blue">
                        <li *ngIf="currentPage!=1" class="page-item disabled"
                            (click)="loadClientAccounts(firstPageUrl)"><a class="page-link">First</a></li>
                        <li *ngIf="currentPage!=1" class="page-item disabled" (click)="loadClientAccounts(prevPageUrl)">
                            <a class="page-link" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                                <span class="sr-only">Previous</span>
                            </a>
                        </li>
                        <li *ngFor="let in of counter() ;let i = index"
                            [ngClass]="(in==currentPage)?'page-item active':'page-item'"
                            (click)="loadClientAccounts(path+'?page='+in)" [disabled]="(in==currentPage)?true:false">
                            <a class="page-link">{{in}}</a>
                        </li>
                        <li *ngIf="currentPage!=lastPage" class="page-item" (click)="loadClientAccounts(nextPageUrl)">
                            <a class="page-link" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                                <span class="sr-only">Next</span>
                            </a>
                        </li>
                        <li *ngIf="currentPage!=lastPage" class="page-item" (click)="loadClientAccounts(lastPageUrl)"><a
                                class="page-link">Last</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</main>
