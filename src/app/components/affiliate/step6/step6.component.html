<section class="user_information">
	<div class="agreement_step0" *ngIf="step6Data.length > 0">
		<div *ngFor="let step_data of step6Data; index as i">
			<div class="step0Div" *ngIf="step_data.id != 25 && step_data.content">
				<p *ngIf="step_data.id == 24">
					{{step_data.content }}
				</p>
			</div>

			<!-- -->
			<div *ngIf="step_data.id != 24">
				<h2 class="headinginfo pl-0" *ngIf="step_data.title">
					{{ i + 1 }}. {{ step_data.title }}
				</h2>
				<p *ngIf="step_data.content" [innerHTML]="step_data.content"></p>

				<!-- other_listing_arr -->
				<ul *ngIf="step_data.other_listing_arr.length > 0">
					<li *ngFor="let point of step_data.other_listing_arr">
						{{ point }}
					</li>
				</ul>

				<!-- title_content_list_arr -->
				<div *ngIf="step_data.title_content_list_arr.length > 0">
					<ul *ngFor="let obj of step_data.title_content_list_arr; index as j">
						<h3 class="headinginfoH3" *ngIf="obj.list_title">
							{{ obj.list_title }}
						</h3>
						<div *ngIf="obj.list_points.length > 0">
							<ul *ngFor="let list_point of obj.list_points">
								<li>
									{{ list_point }}
								</li>
							</ul>
							<p *ngIf="obj.list_subcontent" class="mt-3">
								{{ obj.list_subcontent }}
							</p>
						</div>
						<p *ngIf="obj.list_content" class="mt-3">
							{{ obj.list_content }}
						</p>
					</ul>
				</div>
			</div>
		</div>

		<div class="row" *ngIf="account_approval!='accepted'">
			<div class="col-md-12">
				<div id="button-container" class="w-100">
					<button class="custom-filled-button green-button mx-auto d-block" (click)="submitForm()">
						Accept
					</button>
				</div>
			</div>
		</div>
		<div class="row" *ngIf="account_approval=='accepted'">
			<div class="col-md-12">
				<div id="button-container" class="w-100">
					<button class="custom-filled-button gray-color mx-auto d-block">
						Accepted
					</button>
				</div>
			</div>
		</div>
