<div class="pg-overlay" *ngIf="isVisible" (click)="dismissed.emit()">
  <div class="pg-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="pg-header">
      <div class="pg-slot-badge">Photo Guide</div>
      <h3 class="pg-title">{{ guide?.label }}</h3>
      <button class="pg-close" (click)="dismissed.emit()">&#x2715;</button>
    </div>

    <!-- Body: two panels -->
    <div class="pg-body">

      <!-- LEFT: angle diagram -->
      <div class="pg-diagram-panel">
        <div class="pg-diagram">
          <app-camera-angle-diagram [angle]="guide?.cameraAngle"></app-camera-angle-diagram>
        </div>
        <div class="pg-angle-chip">
          <svg class="pg-cam-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="none" d="M0 0h24v24H0V0z"/>
            <circle cx="12" cy="12" r="3"/>
            <path d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
          </svg>
          {{ guide?.angleLabel }}
        </div>
        <p class="pg-instruction">{{ guide?.instruction }}</p>
      </div>

      <!-- RIGHT: dos/donts -->
      <div class="pg-tips-panel">
        <div class="pg-section">
          <div class="pg-section-label pg-section-label--do">&#10003; Do's</div>
          <ul class="pg-checklist">
            <li *ngFor="let tip of guide?.dos" class="do-item">
              <span class="check-icon">&#10003;</span> {{ tip }}
            </li>
          </ul>
        </div>
        <div class="pg-section">
          <div class="pg-section-label pg-section-label--dont">&#10007; Don'ts</div>
          <ul class="pg-checklist">
            <li *ngFor="let tip of guide?.donts" class="dont-item">
              <span class="x-icon">&#10007;</span> {{ tip }}
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Footer CTA -->
    <div class="pg-footer">
      <button class="pg-skip" (click)="dismissed.emit()">Skip for now</button>
      <button class="pg-cta" (click)="confirmed.emit()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="none" d="M0 0h24v24H0V0z"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
        </svg>
        Take Photo
      </button>
    </div>
  </div>
</div>
