<!-- front-left: camera at front-left corner of top-view car -->
<ng-container *ngIf="angle === 'front-left'">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="cad-svg">
    <!-- Car body -->
    <rect x="65" y="30" width="70" height="145" rx="12" fill="#e8e8e8" stroke="#aaa" stroke-width="2"/>
    <!-- Windshield -->
    <rect x="73" y="50" width="54" height="28" rx="3" fill="#b8d8f8" opacity="0.8"/>
    <!-- Rear window -->
    <rect x="73" y="128" width="54" height="22" rx="3" fill="#b8d8f8" opacity="0.8"/>
    <!-- Wheels -->
    <rect x="54" y="42" width="13" height="22" rx="3" fill="#555"/>
    <rect x="133" y="42" width="13" height="22" rx="3" fill="#555"/>
    <rect x="54" y="141" width="13" height="22" rx="3" fill="#555"/>
    <rect x="133" y="141" width="13" height="22" rx="3" fill="#555"/>
    <!-- Direction arrow: front -->
    <text x="100" y="24" text-anchor="middle" font-size="10" fill="#888">FRONT</text>
    <!-- Camera at front-left -->
    <rect x="18" y="18" width="26" height="20" rx="4" fill="#f89b41" stroke="#c07000" stroke-width="1.5"/>
    <circle cx="31" cy="28" r="6" fill="#fff" stroke="#c07000" stroke-width="1.5"/>
    <circle cx="31" cy="28" r="3" fill="#555"/>
    <rect x="27" y="13" width="8" height="6" rx="1" fill="#f89b41" stroke="#c07000" stroke-width="1"/>
    <!-- Dashed line from camera to car corner -->
    <line x1="44" y1="32" x2="63" y2="42" stroke="#f89b41" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Arrow head -->
    <polygon points="63,42 57,38 60,46" fill="#f89b41"/>
    <!-- Label -->
    <text x="31" y="52" text-anchor="middle" font-size="9" fill="#c07000" font-weight="bold">YOU</text>
  </svg>
</ng-container>

<!-- interior-front: camera in rear seat shooting forward -->
<ng-container *ngIf="angle === 'interior-front'">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="cad-svg">
    <!-- Car silhouette side view -->
    <rect x="20" y="80" width="160" height="60" rx="8" fill="#e8e8e8" stroke="#aaa" stroke-width="2"/>
    <!-- Roof -->
    <path d="M50,80 Q70,45 130,45 L150,80Z" fill="#d0d0d0" stroke="#aaa" stroke-width="2"/>
    <!-- Windshield -->
    <path d="M55,80 Q68,52 115,52 L120,80Z" fill="#b8d8f8" opacity="0.8"/>
    <!-- Rear window -->
    <path d="M130,52 L148,80 L135,80Z" fill="#b8d8f8" opacity="0.8"/>
    <!-- Front seats -->
    <rect x="60" y="90" width="30" height="35" rx="3" fill="#bbb" stroke="#999" stroke-width="1"/>
    <!-- Rear seats -->
    <rect x="110" y="90" width="40" height="35" rx="3" fill="#ccc" stroke="#999" stroke-width="1"/>
    <!-- Wheels -->
    <circle cx="55" cy="140" r="18" fill="#555"/>
    <circle cx="55" cy="140" r="8" fill="#888"/>
    <circle cx="145" cy="140" r="18" fill="#555"/>
    <circle cx="145" cy="140" r="8" fill="#888"/>
    <!-- Camera in rear, facing front -->
    <rect x="122" y="93" width="20" height="15" rx="3" fill="#f89b41" stroke="#c07000" stroke-width="1.5"/>
    <circle cx="132" cy="100" r="5" fill="#fff" stroke="#c07000" stroke-width="1.5"/>
    <circle cx="132" cy="100" r="2.5" fill="#555"/>
    <!-- Arrow showing direction (right to left = rear to front) -->
    <line x1="122" y1="100" x2="95" y2="100" stroke="#f89b41" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="95,100 101,96 101,104" fill="#f89b41"/>
    <text x="132" y="83" text-anchor="middle" font-size="9" fill="#c07000" font-weight="bold">YOU</text>
    <text x="75" y="75" text-anchor="middle" font-size="9" fill="#888">← shooting forward</text>
  </svg>
</ng-container>

<!-- dashboard: close-up dashboard icon -->

    <rect x="20" y="60" width="160" height="90" rx="10" fill="#333" stroke="#555" stroke-width="2"/>

<!-- trunk: rear view, trunk open -->
<ng-container *ngIf="angle === 'trunk'">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="cad-svg">
    <!-- Rear of car -->
    <rect x="35" y="90" width="130" height="60" rx="8" fill="#e8e8e8" stroke="#aaa" stroke-width="2"/>
    <!-- Trunk lid open (angled upward) -->
    <path d="M35,90 L35,50 L165,50 L165,90Z" fill="#d0d0d0" stroke="#aaa" stroke-width="2" opacity="0.7"/>
    <!-- Trunk interior -->
    <rect x="42" y="95" width="116" height="48" rx="5" fill="#c8b8a8" stroke="#aaa" stroke-width="1"/>
    <!-- Trunk label -->
    <text x="100" y="125" text-anchor="middle" font-size="11" fill="#666">CARGO AREA</text>
    <!-- Tail lights -->
    <rect x="35" y="95" width="18" height="25" rx="3" fill="#cc3333" opacity="0.8"/>
    <rect x="147" y="95" width="18" height="25" rx="3" fill="#cc3333" opacity="0.8"/>
    <!-- Bumper -->
    <rect x="30" y="148" width="140" height="10" rx="4" fill="#bbb" stroke="#999" stroke-width="1"/>
    <!-- Wheels rear -->
    <rect x="30" y="155" width="30" height="15" rx="6" fill="#555"/>
    <rect x="140" y="155" width="30" height="15" rx="6" fill="#555"/>
    <!-- Camera above trunk, shooting down/in -->
    <rect x="84" y="20" width="32" height="24" rx="5" fill="#f89b41" stroke="#c07000" stroke-width="1.5"/>
    <circle cx="100" cy="32" r="8" fill="#fff" stroke="#c07000" stroke-width="1.5"/>
    <circle cx="100" cy="32" r="4" fill="#555"/>
    <rect x="96" y="14" width="8" height="7" rx="1" fill="#f89b41" stroke="#c07000" stroke-width="1"/>
    <line x1="100" y1="44" x2="100" y2="88" stroke="#f89b41" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="100,88 96,82 104,82" fill="#f89b41"/>
    <text x="100" y="10" text-anchor="middle" font-size="9" fill="#c07000" font-weight="bold">YOU</text>
  </svg>
</ng-container>

<!-- detail: magnifying glass close-up -->
<ng-container *ngIf="angle === 'detail'">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="cad-svg">
    <!-- Feature subject (e.g. logo / trim detail) -->
    <rect x="55" y="65" width="90" height="70" rx="8" fill="#e8e8e8" stroke="#aaa" stroke-width="2"/>
    <!-- Interior texture suggesting premium feature -->
    <rect x="65" y="75" width="70" height="50" rx="4" fill="#c8b89a"/>
    <circle cx="100" cy="100" r="15" fill="#d4a060" stroke="#a07040" stroke-width="2"/>
    <text x="100" y="105" text-anchor="middle" font-size="14" fill="#7a5020" font-weight="bold">★</text>

    <line x1="151" y1="97" x2="170" y2="118" stroke="#f89b41" stroke-width="6" stroke-linecap="round"/>

<!-- doc: document flat with camera overhead -->

    <text x="100" y="7" text-anchor="middle" font-size="9" fill="#c07000" font-weight="bold">YOU</text>
