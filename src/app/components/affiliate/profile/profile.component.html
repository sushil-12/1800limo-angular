<main id="step1">
    <form class="step_form_wrapper">
        <section class="user_information">
            <h2 class="headinginfo">Profile</h2>
            <div class="container">
                <div class="vehtype_extintwrap single-image">
                    <div class="row mt-2">
                        <div class="col-md-4">
                            <div class="vehtype_extint">
                                <div>
                                    <p class="d-flex justify-content-left">Profile Picture</p>
                                    <img *ngIf="profile_pic; else no_profile_pic" class="profile_pic"
                                        src="{{profile_pic}}" alt="Profile Picture"
                                        (click)="showImageInModal(profile_pic)">
                                    <ng-template #no_profile_pic>
                                        <img class="profile_pic" src="../../../../assets/images/user.png"
                                            alt="Profile Picture">
                                    </ng-template>
                                    <ul class="mt-3 d-flex justify-content-left">
                                        <li>
                                            <button tabindex="1" class="changeuploaded">
                                                <input type="file" (change)="profile_pic_change($event)" tabindex="-1">
                                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path fill="none" d="M0 0h24v24H0V0z"></path>
                                                    <circle cx="12" cy="12" r="3"></circle>
                                                    <path
                                                        d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z">
                                                    </path>
                                                </svg>
                                                Change
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <mat-form-field appearance="outline">
                            <mat-label>First Name <span class="asterisk">*</span></mat-label>
                            <input matInput readonly placeholder="First Name" id="first_name" tabIndex="1">
                        </mat-form-field>
                    </div>
                    <div class="col-md-4">
                        <mat-form-field appearance="outline" tabIndex="1">
                            <mat-label>Middle Name</mat-label>
                            <input matInput readonly placeholder="Middle Name" id="middle_name">
                        </mat-form-field>
                    </div>
                    <div class="col-md-4">
                        <mat-form-field appearance="outline">
                            <mat-label>Last Name <span class="asterisk">*</span></mat-label>
                            <input matInput readonly placeholder="Last Name" id="last_name" tabIndex="1">
                        </mat-form-field>
                    </div>
                    <div class="col-md-6">
                        <mat-form-field appearance="outline" class="read-only">
                            <mat-label>Affiliate E-mail <span class="asterisk">*</span></mat-label>
                            <input matInput readonly placeholder="Affiliate E-mail" id="email" tabIndex="1">
                        </mat-form-field>
                    </div>
                    <div class="col-md-6">
                        <mat-form-field appearance="outline" class="read-only mat-custom-phone">
                            <mat-label>Affiliate Phone<span class="asterisk">*</span></mat-label>
                            <input id="phone" (intlTelInputObject)="telInputObjectCell($event)" matInput placeholder="Affiliate Phone" ng2TelInput readonly tabIndex="1" />
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </section>
        <section class="billing_inforamtion">
            <ul class="mt-3">
                <li><button class="custom-btn deactivate-button" data-toggle="modal"
                        data-target="#deactivateConfirmationModal" tabIndex="1">Suspend Account</button> </li>
            </ul>
        </section>
    </form>
</main>

<div class="modal fade" id="deactivateConfirmationModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <button type="button" class="close closeButton" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
            <div class="modal-body text-center">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" height="70">
                    <g data-name="Layer 51" fill="#ea4444" class="color000 svgShape">
                        <path d="M16,2A14,14,0,1,0,30,16,14,14,0,0,0,16,2Zm0,26A12,12,0,1,1,28,16,12,12,0,0,1,16,28Z"
                            fill="#ea4444" class="color000 svgShape"></path>
                        <path
                            d="M22.71,9.29a1,1,0,0,0-1.42,0L16,14.59l-5.29-5.3a1,1,0,0,0-1.42,1.42L14.59,16l-5.3,5.29a1,1,0,0,0,0,1.42,1,1,0,0,0,1.42,0L16,17.41l5.29,5.3a1,1,0,0,0,1.42,0,1,1,0,0,0,0-1.42L17.41,16l5.3-5.29A1,1,0,0,0,22.71,9.29Z"
                            fill="#ea4444" class="color000 svgShape"></path>
                    </g>
                </svg>
                <h5 class="modal-title my-3" id="exampleModalLabel">Once you suspend, you can't use your account.<br> Only Admin can reactivate your account.</h5>
            </div>
            <div class="text-center">
                <button type="button" class="custom-btn yes-btn mr-2"
                    (click)="deactivateAffiliateAccount()">Yes</button>
                <button type="button" class="custom-btn no-btn" data-dismiss="modal" aria-label="Close">No</button>
            </div>
        </div>
    </div>
</div>

<!-- Image modal -->
<app-image-modal (closeTab)="closeButton()" [modalImage]="modalImage"></app-image-modal>

<!-- snackbar -->
<div id="snackbar">{{snackbarMsg}}</div>
