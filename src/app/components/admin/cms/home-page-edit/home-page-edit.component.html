<ngx-spinner></ngx-spinner>
<main>
	<!-- Main page content-->
	<form [formGroup]="editHomePageContentForm">
		<!-----BILLING INFO-------------->
		<section class="user_information">
			<h2 class="headinginfo">{{ heading }}</h2>
			<div class="" id="accordionSidebar1">
				<div class="">
					<div class="container py-2">
						<div class="row">
							<div class="col-md-12 {{title + ' test'}}" *ngIf="title">
								<mat-form-field appearance="outline">
									<mat-label>Title</mat-label>
									<input matInput placeholder="Title" formControlName="title" readonly>
								</mat-form-field>
							</div>
							<div class="col-md-12" *ngIf="subtitle">
								<mat-form-field appearance="outline">
									<mat-label>Subtitle</mat-label>
									<input matInput placeholder="Subtitle" formControlName="subtitle">
								</mat-form-field>
							</div>
							<div class="col-md-12" *ngIf="video_url">
								<mat-form-field appearance="outline">
									<mat-label>Video Link</mat-label>
									<input matInput placeholder="Video Link" formControlName="video_url">
								</mat-form-field>
							</div>
							<div class="col-md-12" *ngIf="content">
								<mat-form-field appearance="outline">
									<mat-label>Content</mat-label>
									<textarea matInput placeholder="Content" cdkTextareaAutosize rows="5"
										#autosize="cdkTextareaAutosize" formControlName="content"></textarea>
								</mat-form-field>
							</div>
						</div>

						<div class="row" *ngIf="imagesRecords.length > 0">
							<div class="col-md-12">

								<div class="p-3 border mt-3" formArrayName="images">

									<h2 class="headinginfo">Client's Logo</h2>
									<div class="p-3 mt-3 d-flex" style="flex-wrap: wrap;">
										<div class="col-md-4"
											*ngFor="let imagesData of multipleImages.controls; let k = index">
											<div class="mt-4" [formGroupName]="k">
												<div class="vehtype_extint">
													<span *ngIf="imagesRecords[k] != null;">
														<img src="{{imagesRecords[k]}}"
															(click)="showImageInModal(clientImage)">
													</span>
													<div *ngIf="imagesRecords[k] == null;" class="emptyImage">
														<img src="../../../../assets/images/empty-image.png">
													</div>
													<ul class="mt-4 list-unstyled">
														<li class="text-center">
															<button class="adduploaded"
																*ngIf="imagesRecords[k] != null">
																<input type="file"
																	(change)="DynamicImageChange($event, 'clientLogo', k, imagesRecords[k].id)"
																	accept="image/jpeg, image/png">
																<svg xmlns="http://www.w3.org/2000/svg"
																	viewBox="0 0 24 24">
																	<path fill="none" d="M0 0h24v24H0V0z" />
																	<circle cx="12" cy="12" r="3" />
																	<path
																		d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" />
																</svg> Change
															</button>
															<button class="adduploaded"
																*ngIf="imagesRecords[k] == null">
																<input type="file"
																	(change)="DynamicImageChange($event, 'clientLogo', k)"
																	accept="image/jpeg, image/png">
																<svg xmlns="http://www.w3.org/2000/svg"
																	viewBox="0 0 24 24">
																	<path fill="none" d="M0 0h24v24H0V0z" />
																	<circle cx="12" cy="12" r="3" />
																	<path
																		d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" />
																</svg> Add
															</button>

														</li>
													</ul>
												</div>
											</div>
										</div>
									</div>
									<div class="row mt-4">
										<div class="col-12 d-flex justify-content-center">
											<button class="custom-btn savebutton" type="button"
												(click)="addImageValue()">Add More Logo</button>
										</div>
									</div>
								</div>
							</div>
						</div>
						<!--end-->




						<div class="row" *ngIf="other_listing_arr.length > 0">
							<div class="col-md-12">
								<div class="p-3 border mt-3" formArrayName="other_listing_arr">
									<h3 class="headinginfoH3">List Content</h3>
									<div class="col-md-12"
										*ngFor="let listObj of other_listing_list.controls; let i = index">
										<div class="row mt-4">
											<div class="col-md-9" [formGroupName]="i">
												<mat-form-field appearance="outline" class="mt-0">
													<mat-label>Listing</mat-label>
													<input matInput placeholder="Listing" formControlName="list">
												</mat-form-field>
											</div>
											<div class="col-md-3  d-flex justify-content-end" *ngIf="i != '0'">
												<button class="custom-btn savebutton" type="button"
													(click)="deleteFieldValue(i)">Delete</button>
											</div>
										</div>
									</div>
									<div class="col-md-12">
										<div class="row mt-4">
											<div class="col-md-5  d-flex justify-content-end">
												<button class="custom-btn savebutton" type="button"
													(click)="addFieldValue()">Add</button>
											</div>
										</div>
									</div>
								</div>
							</div>
							<!--end-->
						</div>

						<div class="row" *ngIf="title_content_list.length > 0">
							<div class="col-md-12">
								<div class="p-3 border mt-3" formArrayName="title_content_list_arr">
									<h3 class="headinginfoH3">List Content</h3>
									<div class="col-md-12"
										*ngFor="let titleContent of title_content_list_list.controls; let m = index">
										<div class="row mt-4">
											<div class="p-3 border mt-3 col-md-12">
												<div class="col-md-12 mt-4" [formGroupName]="m">
													<mat-form-field appearance="outline" class="mt-0">
														<mat-label>Title</mat-label>
														<input matInput placeholder="Title" formControlName="title">
													</mat-form-field>
												</div>
												<div class="col-md-12 mt-4" [formGroupName]="m">
													<mat-form-field appearance="outline" class="mt-0">
														<mat-label>Content</mat-label>
														<textarea matInput placeholder="Content"
															formControlName="content"></textarea>
													</mat-form-field>
												</div>
												<div class="col-md-12 mt-4  d-flex justify-content-center"
													*ngIf="m != '0'">
													<button class="custom-btn savebutton" type="button"
														(click)="deleteTitleContentValue(m)">Delete</button>
												</div>
											</div>
										</div>
									</div>
									<div class="col-md-12">
										<div class="row mt-4">
											<div class="col-md-12  d-flex justify-content-center">
												<button class="custom-btn savebutton" type="button"
													(click)="addTitleContentValue()">Add</button>
											</div>
										</div>
									</div>
								</div>
							</div>
							<!--end-->
						</div>



						<!-- 
							Slides List
						 -->
						<div class="row" *ngIf="slider_type_content.length > 0">
							<div class="col-md-12">
								<div class="p-3 border mt-3" formArrayName="slider_type_content">
									<h3 class="headinginfoH3">Slides List</h3>
									<div class="col-md-12"
										*ngFor="let listObj of slider_type_content_list.controls; let j = index">
										<div class="row mt-4">
											<div class="p-3 border mt-3 col-md-12">
												<div class="col-md-12 mt-4" [formGroupName]="j">
													<mat-form-field appearance="outline" class="mt-0">
														<mat-label>Title</mat-label>
														<input matInput placeholder="Title" formControlName="title">
													</mat-form-field>
												</div>
												<div class="col-md-12 mt-4" [formGroupName]="j">
													<mat-form-field appearance="outline" class="mt-0">
														<mat-label>Content</mat-label>
														<input matInput placeholder="Content" formControlName="content">
													</mat-form-field>
												</div>
												<!--upload image-->
												<div class="col-md-12 mt-4" [formGroupName]="j">
													<div class="vehtype_extint">
														<div class="col-md-7">
															<div class="">
																<div>
																	<p *ngIf="imageArray[j] != null">Slider Image <span
																			class="asterisk">*</span></p>
																	<img src="{{imageArray[j]}}"
																		(click)="showImageInModal(clientImage)"
																		*ngIf="imageArray[j] != null">
																</div>
																<ul class="mt-4 list-unstyled text-center">
																	<li>
																		<button class="adduploaded"
																			*ngIf="imageArray[j] != null">
																			<input type="file"
																				(change)="DynamicImageChange($event, 'sliderImages', j, slider_type_content[j].image.id)"
																				accept="image/jpeg, image/png">
																			<svg xmlns="http://www.w3.org/2000/svg"
																				viewBox="0 0 24 24">
																				<path fill="none" d="M0 0h24v24H0V0z" />
																				<circle cx="12" cy="12" r="3" />
																				<path
																					d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" />
																			</svg> Change
																		</button>
																		<button class="adduploaded"
																			*ngIf="imageArray[j] == null">
																			<input type="file"
																				(change)="DynamicImageChange($event, 'sliderImages', j, null)"
																				accept="image/jpeg, image/png">
																			<svg xmlns="http://www.w3.org/2000/svg"
																				viewBox="0 0 24 24">
																				<path fill="none" d="M0 0h24v24H0V0z" />
																				<circle cx="12" cy="12" r="3" />
																				<path
																					d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" />
																			</svg> Add
																		</button>
																	</li>
																</ul>
															</div>
														</div>
													</div>
												</div>

												<!--end image upload-->
												<div class="col-3 d-flex justify-content-end"
													*ngIf="j == '0'; else elseBlock">
													<!-- <button class="custom-btn savebutton" type="button" (click)="addSliderContentFieldValue()">Add</button> -->
												</div>
												<ng-template #elseBlock>
													<div class="col-md-12  d-flex justify-content-center mt-4">
														<button class="custom-btn savebutton" type="button"
															(click)="deleteSlide(j)">Delete</button>
													</div>
												</ng-template>
											</div>
										</div>
									</div>
									<div class="row mt-4">
										<div class="col-12 d-flex justify-content-center">
											<button class="custom-btn savebutton" type="button"
												(click)="addSliderContentFieldValue()">Add</button>
										</div>
									</div>
								</div>
							</div>
						</div>
						<!-- 
							Slides List ends
						 -->

						<div class="row" *ngIf="other_group_listing_arr.length > 0">
							<div class="col-md-12">
								<div class="p-3 border mt-3" formArrayName="other_group_listing_arr">
									<h3 class="headinginfoH3">List Group Content</h3>

									<div class="col-md-12"
										*ngFor="let listGroupObj of other_group_listing_list.controls; let i = index">
										<div class="row mt-4">
											<div class="col-md-9" [formGroupName]="i">
												<mat-form-field appearance="outline" class="mt-0">
													<mat-label>Title</mat-label>
													<input matInput placeholder="Title" formControlName="title">
												</mat-form-field>
												<mat-form-field appearance="outline" class="mt-0">
													<mat-label>Image URL</mat-label>
													<input matInput placeholder="Image URL" formControlName="imageUrl">
												</mat-form-field>
												<mat-form-field appearance="outline" class="mt-0">
													<mat-label>List</mat-label>
													<input matInput placeholder="List" formControlName="list">
												</mat-form-field>
												<div formArrayName="list">

												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
							<!--end-->


						</div>

						<div class="row" *ngIf="section_status">
							<div class="col-md-12">
								<mat-form-field appearance="outline">
									<mat-label>Status</mat-label>
									<mat-select formControlName="section_status">
										<mat-option value="enable">Enable</mat-option>
										<mat-option value="disable">Disable</mat-option>
									</mat-select>
								</mat-form-field>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<div class="billing_inforamtion">
			<ul>
				<li><button class="custom-btn savebutton" (click)="saveHomePageSection()">SAVE</button> </li>
				<li><button class="custom-btn backbutton" (click)="backButton()"><i class="fa fa-arrow-circle-left"
							aria-hidden="true"></i></button> </li>
			</ul>
		</div>
	</form>
</main>
