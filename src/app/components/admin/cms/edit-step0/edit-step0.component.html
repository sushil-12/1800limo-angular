<ngx-spinner></ngx-spinner>
<main>
	<!-- Main page content-->
	<form [formGroup]="editContentForm">
		<!-----BILLING INFO-------------->
		<section class="user_information">
			<h2 class="headinginfo">Edit {{title}} section of {{ heading }}</h2>
			<div class="" id="accordionSidebar1">
				<div class="">
					<div class="container py-2">
						<div class="row">
							<div class="col-md-12" *ngIf="title">
								<mat-form-field appearance="outline">
									<mat-label>Title</mat-label>
									<input matInput placeholder="Title" formControlName="title">
								</mat-form-field>
							</div>
							<div class="col-md-12" *ngIf="subtitle">
								<mat-form-field appearance="outline">
									<mat-label>Subtitle</mat-label>
									<input matInput placeholder="Subtitle" formControlName="subtitle">
								</mat-form-field>
							</div>
							<div class="col-md-12" *ngIf="video_url">
								<mat-form-field appearance="outline">
									<mat-label>Video Link</mat-label>
									<input matInput placeholder="Video Link" formControlName="video_url">
								</mat-form-field>
							</div>
							<div class="col-md-12" *ngIf="content">
								<mat-form-field appearance="outline">
									<mat-label>Content</mat-label>
									<textarea matInput placeholder="Content" formControlName="content" dkTextareaAutosize rows="5"
									#autosize="cdkTextareaAutosize"></textarea>
								</mat-form-field>
							</div>

						</div>

						<div class="row" *ngIf="other_listing_arr.length > 0">
							<div class="col-md-12">
								<div class="p-3 border mt-3" formArrayName="other_listing_arr">
									<h3 class="headinginfoH3">List Content</h3>
									<div class="col-md-12"
										*ngFor="let listObj of other_listing_list.controls; let i = index">
										<div class="row mt-4">
											<div class="col-md-9" [formGroupName]="i">
												<mat-form-field appearance="outline" class="mt-0">
													<mat-label>Listing</mat-label>
													<input matInput placeholder="Listing" formControlName="list">
												</mat-form-field>
											</div>
											<div class="col-3 d-flex justify-content-end"
												*ngIf="i == '0'; else elseBlock">
												<button class="custom-btn savebutton" type="button"
													(click)="addFieldValue()">Add</button>
											</div>
											<ng-template #elseBlock>
												<div class="col-md-3  d-flex justify-content-end">
													<button class="custom-btn savebutton" type="button"
														(click)="deleteFieldValue(i)">Delete</button>
												</div>
											</ng-template>
										</div>
									</div>
								</div>
							</div>
							<!--end-->


						</div>

						<div class="row" *ngIf="other_group_listing_arr.length > 0">
							<div class="col-md-12">
								<div class="p-3 border mt-3" formArrayName="other_group_listing_arr">
									<h3 class="headinginfoH3">other_group_listing_arr - List Group Content</h3>

									<div class="col-md-12"
										*ngFor="let listGroupObj of other_group_listing_list.controls; let j = index">
										<div class="row mt-4 p-3 border mt-3">
											<div class="col-md-12 mt-4" [formGroupName]="j">
												<mat-form-field appearance="outline" class="mt-0">
													<mat-label>Title</mat-label>
													<input matInput placeholder="Title" formControlName="title">
												</mat-form-field>
											</div>
											<div class="col-md-5 mt-4 d-flex justify-content-center"
												[formGroupName]="j">
												<div class="vehtype_extint">
													<span *ngIf="listImage[j] != null;">
														<img src="{{listImage[j]}}"
															(click)="showImageInModal(clientImage)"
															style="border: 1px solid #e5e3e3;">
													</span>
													<span *ngIf="listImage[j] == null;">
														<img src="../../../../assets/images/empty-image.png"
															style="border: 1px solid #e5e3e3;">
													</span>
													<ul class="mt-4 list-unstyled">
														<li class="text-center">
															<button class="adduploaded"
																*ngIf="listImage[j] != null;else addImgBtn">
																<input type="file"
																	(change)="imageChangefun($event, 'listingImage', j, listImage[j].id)"
																	accept="image/jpeg, image/png">
																<svg xmlns="http://www.w3.org/2000/svg"
																	viewBox="0 0 24 24">
																	<path fill="none" d="M0 0h24v24H0V0z" />
																	<circle cx="12" cy="12" r="3" />
																	<path
																		d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" />
																</svg> Change
															</button>
															<ng-template #addImgBtn><button class="adduploaded">
																	<input type="file"
																		(change)="imageChangefun($event, 'addListingImage', j)"
																		accept="image/jpeg, image/png">
																	<svg xmlns="http://www.w3.org/2000/svg"
																		viewBox="0 0 24 24">
																		<path fill="none" d="M0 0h24v24H0V0z" />
																		<circle cx="12" cy="12" r="3" />
																		<path
																			d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" />
																	</svg> Add
																</button></ng-template>

														</li>
													</ul>
												</div>
											</div>
											<!--list Content section-->
											<div class="col-md-12 mt-4" [formGroupName]="j">
												<div class="row">
													<div class="col-md-12">
														<div class="p-3 border mt-3" formArrayName="multiChoice">
															<h3 class="headinginfoH3">List Content {{j}}</h3>
															<div class="col-md-12"
																*ngFor="let choice of multichoice(j).controls; let l = index">
																<div class="row mt-4">
																	<div class="col-md-9" [formGroupName]="l">
																		<mat-form-field appearance="outline"
																			class="mt-0">
																			<mat-label>Choice</mat-label>
																			<input matInput placeholder="Choice"
																				formControlName="choice">
																		</mat-form-field>
																	</div>
																	<div class="col-md-3  d-flex justify-content-end"
																		*ngIf="l != '0'">
																		<button class="custom-btn savebutton"
																			type="button"
																			(click)="deleteChoiceList(j, l)">Delete</button>
																	</div>
																</div>
															</div>

															<div class="col-md-12 mt-4 d-flex justify-content-center">
																<button class="custom-btn savebutton" type="button"
																	(click)="AddChoiceList(j)">Add</button>
															</div>
														</div>
													</div>
												</div>
												<!--end content-->



											</div>

										</div>

										<div class="col-md-12 mt-4 d-flex justify-content-center">
											<button class="custom-btn savebutton" type="button"
												(click)="RemoveListGroup(j)">Remove</button>
										</div>
									</div>
								</div>
								<div class="row mt-4">
									<div class="col-12 d-flex justify-content-center">
										<button class="custom-btn savebutton" type="button" (click)="addBlockList()">
											Add New List
										</button>
									</div>
								</div>
							</div>
							<!--end-->


						</div>


						<div class="row">
							<div class="col-md-12">
								<mat-form-field appearance="outline">
									<mat-label>Status</mat-label>
									<mat-select formControlName="section_status">
										<mat-option value="enable">Enable</mat-option>
										<mat-option value="disable">Disable</mat-option>
									</mat-select>
								</mat-form-field>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<section class="billing_inforamtion">
			<ul>
				<li><button class="custom-btn savebutton" (click)="saveEditValue()">SAVE</button> </li>
				<li><button class="custom-btn backbutton" (click)="backButton()">BACK</button> </li>
			</ul>
		</section>
	</form>
</main>
