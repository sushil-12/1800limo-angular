<main>
	<!-- Main page content-->
	<form [formGroup]="editAboutUsForm" appInvalidControlScroll>
		<!-----BILLING INFO-------------->
		<section class="user_information">
			<h2 class="headinginfo">Edit {{title}} section of {{ heading }}</h2>
			<div class="" id="accordionSidebar1">
				<div class="container">

					<!-- 
						Section Status
					-->
					<div class="row mt-2">
						<div class="col-md-12">
							<mat-form-field appearance="outline">
								<mat-label>Status</mat-label>
								<mat-select formControlName="section_status">
									<mat-option value="enable">Enable</mat-option>
									<mat-option value="disable">Disable</mat-option>
								</mat-select>
							</mat-form-field>
						</div>
					</div>
					<!-- 
						Section Status ends
					-->



					<!-- 
						Main Heading Content of timeline
					-->
					<div class="row mt-5">
						<div class="col-md-12" *ngIf="title">
							<mat-form-field appearance="outline">
								<mat-label>Title</mat-label>
								<input matInput placeholder="Title" formControlName="title">
							</mat-form-field>
						</div>
						<div class="col-md-12" *ngIf="subtitle">
							<mat-form-field appearance="outline">
								<mat-label>Subtitle</mat-label>
								<input matInput placeholder="Subtitle" formControlName="subtitle">
							</mat-form-field>
						</div>
						<div class="col-md-12" *ngIf="video_url">
							<mat-form-field appearance="outline">
								<mat-label>Video Link</mat-label>
								<input matInput placeholder="Video Link" formControlName="video_url">
							</mat-form-field>
						</div>
						<div class="col-md-12" *ngIf="content">
							<mat-form-field appearance="outline">
								<mat-label>Content</mat-label>
								<textarea matInput placeholder="Content" formControlName="content"></textarea>
							</mat-form-field>
						</div>
					</div>
					<!-- 
						Main Heading Content of timeline ends
					-->

						Images Data
					-->

					<!-- 
						Timeline Slider
					-->
					<div class="row py-2" *ngIf="timelineSlider.length > 0">
						<div class="col-md-12">
							<h3 class="headinginfoH3"> Timeline Slides </h3>
							<div class="mt-2" formArrayName="timeline_slider">
								<div class="col-md-12" *ngFor="let timeline of timelineSliderObj.controls; let j = index">
									<div class="row mt-3 p-3 border rounded-lg">
										<div class="col-md-12">
											<p style="font-weight: bold; font-size: 1.37rem">
												Slide {{ j + 1 }}
											</p>
											<div class="col-md-12" [formGroupName]="j">
												<mat-form-field appearance="outline" class="mt-0">
													<mat-label> Year </mat-label>
													<input matInput placeholder="Year" formControlName="year">
												</mat-form-field>
											</div>
											<!-- {{timeline?.controls?.title?.invalid}} -->
											<div class="col-md-12 mt-4" [formGroupName]="j">
												<mat-form-field appearance="outline" class="mt-0">
													<mat-label> Title </mat-label>
													<input matInput placeholder="Title" formControlName="title" />
												</mat-form-field>
												<div class="error-box">
													<div class="error-message ng-invalid"
													*ngIf="(submittedForm && timeline?.controls?.title?.invalid) || (title?.touched && title?.dirty)">
													<p class="text-danger text-lg m-0"
													*ngIf="timeline?.controls?.title?.errors?.required">
													This field is required
												</p>
													</div>
												</div>
											</div>
											<div class="col-md-12 mt-4" [formGroupName]="j">
												<mat-form-field appearance="outline" class="mt-0">
													<mat-label> Text </mat-label>
													<textarea matInput placeholder="Text" formControlName="text"
														rows="4"></textarea>
												</mat-form-field>
											</div>
											<!--images in timeline-->
											<div class="row">
												<div class="col-md-12" [formGroupName]="j">
													<div class="p-3 border rounded-lg mt-3"
														formArrayName="timeline_images">
														<div class="row">
															<div class="col-12 d-flex justify-content-between">
																<h5 class="headinginfo">Images Type Content</h5>
																<button class="custom-btn savebutton" type="button"
																	(click)="addNewTimelineImage(j)">Add Image</button>
															</div>
														</div>
														<div class="p-3 mt-3 d-flex" style="flex-wrap: wrap;">
															<div class="col-md-4"
																*ngFor="let image_record of imagesRecords[j]; let k = index">
																<div class="mt-4" [formGroupName]="k">
																	<div class="vehtype_extint">
																		<span *ngIf="image_record.id != null">
																			<img src="{{image_record.path}}"
																				(click)="showImageInModal(clientImage)">
																		</span>
																		<div *ngIf="image_record.id == null;"
																			class="emptyImage">
																			<img
																				src="../../../../assets/images/empty-image.png">
																		</div>
																		<ul class="mt-4 list-unstyled">
																			<li class="text-center">
																				<button class="adduploaded"
																					*ngIf="image_record.id != null">
																					<input type="file"
																						(change)="DynamicImageChange($event, 'about-us', j, k)">
																					<svg xmlns="http://www.w3.org/2000/svg"
																						viewBox="0 0 24 24">
																						<path fill="none"
																							d="M0 0h24v24H0V0z" />
																						<circle cx="12" cy="12" r="3" />
																						<path
																							d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" />
																					</svg> Change
																				</button>
																				<button class="adduploaded"
																					*ngIf="image_record.id == null">
																					<input type="file"
																						(change)="DynamicImageChange($event, 'about-us', j, k)">
																					<svg xmlns="http://www.w3.org/2000/svg"
																						viewBox="0 0 24 24">
																						<path fill="none"
																							d="M0 0h24v24H0V0z" />
																						<circle cx="12" cy="12" r="3" />
																						<path
																							d="M20 4h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H9.88c-.56 0-1.1.24-1.48.65L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" />
																					</svg> Add
																				</button>

																			</li>
																		</ul>
																	</div>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
											<!--end images-->

											<div class="col-md-12 mt-4 d-flex justify-content-center" *ngIf="j != 0;">
												<button class="custom-btn savebutton" type="button"
													(click)="deleteTimeline(j)">Delete Slide</button>
											</div>

										</div>

									</div>
								</div>

								<div class="col-md-12 mt-4 d-flex justify-content-center">
									<button class="custom-btn savebutton" type="button" (click)="addTimeline()">Add
										Slide</button>
								</div>
							</div>
						</div>
					</div>
					<!-- 
						Timeline Slider ends
					-->
				</div>
			</div>
		</section>
	</form>
		<section class="billing_inforamtion">
			<ul>
				<li><button class="custom-btn savebutton" type="submit" (click)="saveEditValue()">SAVE</button> </li>
				<li><button class="custom-btn backbutton" (click)="backToMainPage()">BACK</button> </li>
			</ul>
		</section>
</main>
