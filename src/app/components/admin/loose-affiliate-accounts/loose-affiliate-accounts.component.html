<ngx-spinner></ngx-spinner>
<main>
    <!-- Main page content-->
    <section class="user_information" id="loose_affiliae_table">
        <h2 class="headinginfo">Loose Affiliate Accounts </h2>
        <div class="containeredd">
            <div class="row">
                <div class="col-md-12">
                    <button class="custom-btn add-button" (click)="addLooseAffiliateClick()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-plus-circle"
                            viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z" />
                            <path
                                d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z" />
                        </svg> Add Loose Affiliate Account
                    </button>
                    <button class="custom-btn add-button ml-2" data-toggle="modal" data-target="#sendEmailModal"
                        (click)="buildSendEmailForm();">
                        Send Email
                    </button>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mt-3 mb-3">
                    <mat-form-field appearance="outline">
                        <mat-label>Search Filter by Key word</mat-label>
                        <input type="text" matInput (keyup)="handleSearchKeyword($event.target.value)"
                            (focus)="$event.target.select()" [value]="searchText"
                            placeholder="Search by name, email, cell phone" id="keyword">
                    </mat-form-field>
                </div>
                <!-- <div class="col-md-2  mt-3 mb-3">
					<button class="custom-btn button2 btnclass" (click)="loadSubLooseAffiliateAcc()">Search</button>
				</div> -->
            </div>
        </div>

        <div class="containeredd driverside_table">
            <div class="row">
                <div class="col-md-12 table-responsive">
                    <table class="table table-striped table-bordered dataTable dt-responsive" id="dataTable" role="grid"
                        aria-describedby="dataTable_info" style="min-height: 30vh;" cellspacing="0">
                        <thead style="background: #f3933d;">
                            <tr role="row">
                                <th>Actions</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Mobile</th>

                            </tr>
                        </thead>
                        <tbody>
                            <tr role="row" class="odd" *ngFor="let LooseAffiliate of LooseAffiliateAcc">
                                <td>
                                    <a class="user-profileded view-button btn-transparent-dark dropdown-toggle"
                                        id="navbarDropdownUserImage" href="javascript:void(0);" role="button"
                                        data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                                        style="text-decoration: none !important;">
                                        <span>View</span>
                                    </a>
                                    <div class="dropdown-menu dropdown-menu-right border-0 shadow animated--fade-in-up"
                                        aria-labelledby="navbarDropdownUserImage">
                                        <a class="dropdown-item" (click)="editLooseAffClick(LooseAffiliate.id)">
                                            <div class="dropdown-item-icon"></div>
                                            Edit Account
                                        </a>
                                        <a class="dropdown-item" data-toggle="modal"
                                            data-target="#deleteConfirmationModal"
                                            (click)="enableDisableClicked(LooseAffiliate.id)">
                                            <div class="dropdown-item-icon"></div>
                                            Delete Account
                                        </a>
                                    </div>
                                </td>
                                <td>
                                    <span [innerHTML]="highlighText(LooseAffiliate?.name)"></span>
                                </td>
                                <td class="clickable" (click)="sendMessage('email', LooseAffiliate)"
                                    data-messagetype="email"><span
                                        [innerHTML]="highlighText(LooseAffiliate?.email)"></span></td>
                                <td class="clickable" (click)="sendMessage('sms', LooseAffiliate)"
                                    data-messagetype="sms"><span
                                        [innerHTML]="highlighText(LooseAffiliate?.phone_isd+LooseAffiliate?.phone)"></span>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
                <!----BACK BTN---->
                <nav aria-label="Page navigation example">
                    <ul class="pagination pagination-circle pg-blue">
                        <li *ngIf="currentPage!=1" class="page-item disabled"
                            (click)="loadSubLooseAffiliateAcc(firstPageUrl)"><a class="page-link">First</a></li>
                        <li *ngIf="currentPage!=1" class="page-item disabled"
                            (click)="loadSubLooseAffiliateAcc(prevPageUrl)">
                            <a class="page-link" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                                <span class="sr-only">Previous</span>
                            </a>
                        </li>
                        <li *ngFor="let in of counter() ;let i = index"
                            [ngClass]="(in==currentPage)?'page-item active':'page-item'"
                            (click)="loadSubLooseAffiliateAcc(path+'?page='+in)"
                            [disabled]="(in==currentPage)?true:false">
                            <a class="page-link">{{in}}</a>
                        </li>
                        <li *ngIf="currentPage!=lastPage" class="page-item"
                            (click)="loadSubLooseAffiliateAcc(nextPageUrl)">
                            <a class="page-link" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                                <span class="sr-only">Next</span>
                            </a>
                        </li>
                        <li *ngIf="currentPage!=lastPage" class="page-item"
                            (click)="loadSubLooseAffiliateAcc(lastPageUrl)"><a class="page-link">Last</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</main>

<!-- Delete confirmation modal -->
<app-delete-confirmation (deleteRecord)="delete()" [alertMessage]="alertMessage"></app-delete-confirmation>

<!-- Message modal -->
<div class="modal fade" tabindex="-1" id="messageModal" aria-labelledby="messageModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h4></h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <p id="affiliate-details"></p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <p id="label">
                            Message:
                        </p>
                        <textarea id="message" formControlName="message" rows="7" placeholder="Your Message" #message
                            style="font-weight: 700;"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer justify-content-end">
                <button class="custom-filled-button" data-dismiss="modal"
                    (click)="sendMessage(messagetype?.type, messagetype?.travelPlanner, message.value)">
                    Send {{ messagetype?.type | titlecase }}
                </button>
            </div>
        </div>
    </div>
</div>

<!-- SEND EMAIL MODAL-->
<div class="modal fade bd-example-modal-lg" id="sendEmailModal" tabindex="-1" role="dialog"
    aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content user_inforamtion">
            <button type="button" (click)="closeModal()" class="close closeButton x-circle-btn" data-dismiss="modal"
                aria-label="Close">
                <i class="bi bi-x-circle"></i>
            </button>
            <div class="modal-header pb-0 d-flex justify-content-center">
                <h3 class="mb-0" id="exampleModalLabel">Send Email to loose Affiliates</h3>
            </div>
            <div class="modal-body">
                <form [formGroup]="sendEmailForm" appInvalidControlScroll>
                    <div class="form-group">
                        <div class="col-md-12">
                            <mat-form-field appearance="outline">
                                <mat-label>Subject <span class="asterisk">*</span></mat-label>
                                <input matInput type="text" formControlName="subject" style="font-weight: 500;">
                            </mat-form-field>
                        </div>
                        <div class="col-md-12">
                            <mat-form-field appearance="outline">
                                <mat-label>
                                    Text Message <span class="asterisk">*</span>
                                </mat-label>
                                <textarea matInput style="white-space: pre-wrap;" formControlName="text_message"
                                    (focus)="$event.target.select()" rows="5" style="font-weight: 500;"></textarea>
                            </mat-form-field>
                        </div>
                        <div class="col-md-12">
                            <mat-form-field appearance="outline">
                                <mat-label>Select Emails <span class="asterisk">*</span></mat-label>
                                <mat-select [formControl]="emails" multiple panelClass="custom-select-panel">
                                    <!-- Add Select All option -->
                                    <mat-option (click)="selectAll()">Select All</mat-option>
                                    <mat-option *ngFor="let option of LooseAffiliateAcc"
                                        [value]="option.email">{{option.name}}</mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer d-flex justify-content-center">
                <button class="custom-btn add-button" type="submit" (click)="sendEmail()"
                    [disabled]="Form.subject?.invalid && (Form.subject.touched || Form.subject.dirty)">Submit</button>
            </div>
        </div>
    </div>
</div>
