<ngx-spinner></ngx-spinner>
<main>

	<!-- Main page content-->
	<section class="driverbooking_top adminbox_shadow user_information">
		<h2 class="headinginfo">Add Staff</h2>
		<div class="containeredd">
			<div class="row mt-3">
				<div class="col-md-12 mb-2">
					<label class="alert alert-danger">Note: Add each different Staff first.</label>
					<!-- <h3 class="addveh_top"><i (click)="addStaffClick(accountId)" class="addplus fa fa-plus" aria-hidden="true"></i> Add staff
				</h3> -->
				</div>
				<!-- <div class="col-md-12 mt-3 mb-3">
                <input type="text" placeholder="Search Filter by Name, Number or Key word" (input)="serach($event.target.value)">
             </div> -->
			</div>
			<div class="row">
				<div class="col-md-12">
					<button class="custom-btn add-button" (click)="addStaffClick(accountId)" tabindex="1">
						<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-plus-circle"
							viewBox="0 0 16 16">
							<path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z" />
							<path
								d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z" />
						</svg> Add Staff
					</button>
				</div>
			</div>
		</div>
		<div class="containeredd driverside_table">
			<div class="row">
				<div class="col-md-12 custom_table table-responsive">
					<table class="table table-striped dataTable dt-responsive" id="dataTable" role="grid"
						aria-describedby="dataTable_info" style="width: 100%;" width="100%" cellspacing="0">
						<thead>
							<tr role="row">
								<th>Name</th>
								<th>Cell</th>
								<th>Depart Tel #</th>
								<th>Email</th>
								<th>Status</th>
								<th>Actions</th>
							</tr>
						</thead>
						<tbody>
							<ng-container *ngIf="staffList">
								<tr role="row" class="odd" *ngFor="let staff of staffList">
									<td>{{staff.first_name+' '+staff.middle_name+' '+staff.last_name}}</td>
									<td>{{staff.cell_number_isd+staff.cell_number}}</td>
									<td>{{staff.dept_tel_isd+staff.dept_tel}}</td>
									<td>{{staff.email}}</td>
									<td>
										<mat-slide-toggle class="example-margin" [color]="color"
											[checked]="staff.status" [disabled]="disabled"
											(change)="enableDisableClicked($event,staff.id)">
										</mat-slide-toggle>
									</td>
									<td>
										<a class="user-profileded btn btn-icon btn-transparent-dark"
											(click)="clickEditStaff(staff.id)" id="navbarDropdownUserImage">
											Edit Staff
										</a>
									</td>
								</tr>
								<tr *ngIf="!staffList?.length">
									<td colspan="6">No Staff Found!</td>
								</tr>
							</ng-container>
						</tbody>
					</table>
				</div>
				<section class="billing_inforamtion">
					<ul>
						<li><button class="custom-btn backbutton" (click)="backButtonClick()" tabindex="-1">
								<svg width="41" height="16" viewBox="0 0 41 16" fill="#fff"
									xmlns="http://www.w3.org/2000/svg">
									<path
										d="M37.963 0.500001H0.5L0.5 2H19.7407H36.963C37.7914 2 38.463 2.67157 38.463 3.5V9C38.463 9.82843 37.7914 10.5 36.963 10.5H19.7407H19.2407V10V6.59305L14.4313 10.75L19.2407 14.907V13V12.5H19.7407H37.963C38.6378 12.5 39.2838 12.2351 39.7591 11.7656C40.2342 11.2963 40.5 10.661 40.5 10V2.5C40.5 1.82723 40.2315 1.35011 39.8074 1.0275C39.3675 0.692862 38.7244 0.500001 37.963 0.500001Z"
										fill="#fff" stroke="#fff" />
								</svg></button> </li>
					</ul>
				</section>
			</div>
		</div>
	</section>
</main>
