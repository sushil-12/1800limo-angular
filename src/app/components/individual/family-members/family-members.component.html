<ngx-spinner type="ball-scale-multiple"></ngx-spinner>
<main>
    <!-- Main page content-->
    <section class="user_information" id="family_member_list">
        <div class="containeredd">
            <div class="row">
                <div class="col-md-7">
                    <h2 class="headinginfo d-flex align-items-center">Other Members / Users List</h2>
                </div>
                <div class="col-md-5 add-member-div">
                    <button class="custom-btn btn-add-other-memeber" (click)="addFamilyMember()"
                        style="margin: 0 !important;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-plus-circle"
                            viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z" />
                            <path
                                d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z" />
                        </svg> Add Other Members / Users
                    </button>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 mt-3 mb-3">
                    <mat-form-field appearance="outline">
                        <mat-label>Search Filter by Key word</mat-label>
                        <input type="text" matInput (keyup)="handleSearchKeyword($event.target.value)"
                            [value]="searchText" placeholder="Search by name, phone number" id="keyword">
                    </mat-form-field>
                </div>
                <!-- <div class="col-md-2  mt-3 mb-3">
					<button class="custom-btn button2 btnclass" (click)="loadClientAccounts()">Search</button>
				</div> -->
            </div>
        </div>

        <div class="containeredd driverside_table">
            <div class="row">
                <div class="col-md-12 table-responsive">
                    <table class="table table-striped table-bordered dataTable dt-responsive" id="dataTable" role="grid"
                        aria-describedby="dataTable_info" style="width: 100%;" width="100%" cellspacing="0">
                        <thead style="background: #f3933d;">
                            <tr role="row">
                                <th style="width: 11%;">Action</th>
                                <th>Status</th>
                                <th>Name</th>
                                <th>Phone number</th>

                            </tr>
                        </thead>
                        <tbody>
                            <tr role="row" class="odd" *ngFor="let familymember of clients">
                                <td>
                                    <!-- <a class="user-profileded btn btn-icon btn-transparent-dark dropdown-toggle"
                                        id="navbarDropdownUserImage" href="javascript:void(0);" role="button"
                                        data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                        <span>View</span>
                                    </a> -->
                                    <!-- <div class="dropdown-menu dropdown-menu-right border-0 shadow animated--fade-in-up"
                                        aria-labelledby="navbarDropdownUserImage"> -->
                                    <button class="view-account-button" (click)="editFamilyMember(familymember.id)">
                                        View
                                    </button>
                                    <!-- </div> -->


                                </td>
                                <td> <mat-slide-toggle class="example-margin" [color]="color"
                                        [checked]="familymember.status == 1" [disabled]="disabled"
                                        (change)="enableDisableClicked($event,familymember.id)">
                                    </mat-slide-toggle>
                                <td>
                                    <span
                                        [innerHTML]="highlighText(familymember?.first_name+' '+familymember?.last_name)"></span>
                                <td><span
                                        [innerHTML]="highlighText(familymember?.phone_isd+familymember?.phone_number)"></span>
                                </td>

                            </tr>

                        </tbody>
                    </table>
                </div>
