<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Under-Construction</title>
    <style>
        .under-construction {
            background-color: #f29439;
        }
        
        .under-construction h1 {
            background: #121FCF;
            background: linear-gradient(to bottom, #333333 0%, #ffffff00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-size: 6vw;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0px;
            margin: 0px;
        }
        
        .under-construction .text-center h2 {
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .under-construction .text-center {
            width: 800px;
            max-width: 100%;
            background-color: #fff;
            box-shadow: 0 0 10px 5px rgb(255 255 255 / 50%);
            padding: 50px 0px;
            border-radius: 25px;
            margin: 0 auto
        }
        
        .under-construction video {
            max-width: 100%
        }
        
        @media (max-width: 1680px) {
            .under-construction h1 {
                font-size: 8vw;
            }
        }
    </style>
</head>

<body>
    <section class="under-construction vh-100 vw-100 d-flex justify-content-center align-items-center">
        <div class="container">
            <h1>1-800-LIMO.COM</h1>
            <div class="text-center">
                <h2>The Page is Under Construction</h2>
                <video muted="muted" source src="https://cdnl.iconscout.com/lottie/premium/thumb/under-construction-page-4474473-3718727.mp4" type="video/mp4" autoplay="autoplay" loop="loop"></video>
            </div>
        </div>
    </section>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
