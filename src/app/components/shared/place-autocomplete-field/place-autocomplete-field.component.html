<div
	class="place-autocomplete-field__wrap"
	[class.place-autocomplete-field__wrap--leading-icon]="showSearchIcon">
	<span *ngIf="showSearchIcon" class="place-autocomplete-field__leading-icon" aria-hidden="true">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" focusable="false">
			<path
				d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
		</svg>
	</span>
	<div class="place-autocomplete-field__control">
		<input
			#nativeInput
			type="text"
			autocomplete="off"
			class="place-autocomplete-field__native"
			[attr.id]="inputId || null"
			[attr.placeholder]="placeholder"
			[attr.aria-label]="ariaLabel || placeholder || 'Address'"
			(focus)="onNativeFocus($event)"
			(blur)="onNativeBlur()"
		/>
	</div>
</div>
